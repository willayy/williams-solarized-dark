name: Release Extension VSIX

on:
  push:
    branches:
      - main
    paths:
      - 'themes/vscode/**'
      - 'package.json'
      - '.vscodeignore'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package extension (VSIX)
        run: npx --yes @vscode/vsce package --out ./williams-solarized-dark.vsix

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" \
              ./williams-solarized-dark.vsix \
              ./themes/antigravity/williams-solarized-dark-antigravity.json \
              ./themes/ghostty/williams-solarized-dark.ghostty \
              ./plugin.json \
              --clobber
          else
            gh release create "$TAG" \
              ./williams-solarized-dark.vsix \
              ./themes/antigravity/williams-solarized-dark-antigravity.json \
              ./themes/ghostty/williams-solarized-dark.ghostty \
              ./plugin.json \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          API_URL="https://open-vsx.org/api/williamnorland/williams-solarized-dark/$VERSION"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL")
          if [ "$STATUS" = "200" ]; then
            echo "Version $VERSION is already published to Open VSX."
          else
            npx --yes ovsx publish ./williams-solarized-dark.vsix -p "$OVSX_PAT"
          fi
